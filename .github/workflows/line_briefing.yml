name: Daily Morning Finance Briefing (LINE)

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = 台灣時間 06:00
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests edge-tts feedparser

      - name: Generate briefing text & mp3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python briefing_line.py

      - name: Upload MP3 to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: audio-latest
          files: briefing.mp3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Briefing & Audio to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUDIO_PUBLIC_URL: "https://github.com/${{ github.repository }}/releases/download/audio-latest/briefing.mp3"
        run: |
          python -c "from briefing_line import send_line; import os; send_line(open('briefing.txt', encoding='utf-8').read(), os.environ['AUDIO_PUBLIC_URL'])"
